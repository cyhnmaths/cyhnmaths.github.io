<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Ders İletişim</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .contact-card h2 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .contact-card p {
            color: #7f8c8d;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        .btn-email {
            background-color: #2b5876;
            color: white;
        }

        .btn i {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>Benimle İletişime Geçin</h2>
        <p>Özel ders talepleri, seviye tespiti ve detaylı bilgi almak için aşağıdaki kanallardan dilediğiniz zaman ulaşabilirsiniz.</p>
        
        <div class="btn-container">
            <!-- Instagram DM Butonu -->
            <!-- Lütfen KULLANICI_ADIN kısmını kendi instagram kullanıcı adınla değiştir -->
            <a href="https://instagram.com/KULLANICI_ADIN" target="_blank" class="btn btn-instagram">
                <i class="fab fa-instagram"></i> Instagram DM ile Yazın
            </a>

            <!-- E-posta (Mail) Butonu -->
            <!-- Lütfen E_POSTA_ADRESIN kısmını kendi mail adresinle değiştir -->
            <a href="mailto:E_POSTA_ADRESIN@gmail.com" class="btn btn-email">
                <i class="fas fa-envelope"></i> E-posta Gönderin
            </a>
        </div>
    </div>

</body>
</html>
